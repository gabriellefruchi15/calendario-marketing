}/* ═══════════════════════════════════════════════════════════
   💾 SISTEMA DE RASCUNHO (AUTO-SAVE)
═══════════════════════════════════════════════════════════ */
const DRAFT_PREFIX = 'cal_draft_';
const DRAFT_MAX_AGE_DAYS = 7;
const DRAFT_DEBOUNCE_MS = 800;

let _draftCurrentId = null;     // ID do card sendo editado (ou 'new' para novo)
let _draftTimer = null;         // Timer do debounce
let _draftDirty = false;        // Tem alterações não salvas?
let _draftInitialSnapshot = ''; // Snapshot inicial pra comparar
let _draftIndicatorTimer = null;

/* ───────── COLETA DOS DADOS DO FORMULÁRIO ───────── */
function gatherCardFormData() {
  return {
    title: document.getElementById('cardTitle')?.value || '',
    date: document.getElementById('cardDate')?.value || '',
    catId: document.getElementById('cardCategory')?.value || '',
    platformId: document.getElementById('cardPlatform')?.value || '',
    bu: document.getElementById('cardBU')?.value || '',
    status: document.getElementById('cardStatus')?.value || '',
    copy: document.getElementById('cardCopy')?.value || '',
    notes: document.getElementById('cardNotes')?.value || '',
    link: document.getElementById('cardLink')?.value || '',
    timestamp: Date.now()
  };
}

/* ───────── APLICA OS DADOS NO FORMULÁRIO ───────── */
function applyCardFormData(data) {
  if (!data) return;
  const setVal = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.value = v || '';
  };
  setVal('cardTitle', data.title);
  setVal('cardDate', data.date);
  setVal('cardCategory', data.catId);
  setVal('cardPlatform', data.platformId);
  setVal('cardBU', data.bu);
  setVal('cardStatus', data.status);
  setVal('cardCopy', data.copy);
  setVal('cardNotes', data.notes);
  setVal('cardLink', data.link);
}

/* ───────── SNAPSHOT (pra comparar mudanças) ───────── */
function snapshotFormData() {
  const d = gatherCardFormData();
  delete d.timestamp;
  return JSON.stringify(d);
}

/* ───────── AUTO-SAVE COM DEBOUNCE ───────── */
function scheduleDraftSave() {
  if (!_draftCurrentId) return;

  // Marca como dirty
  const currentSnapshot = snapshotFormData();
  _draftDirty = (currentSnapshot !== _draftInitialSnapshot);

  // Mostra "Salvando..."
  showDraftIndicator('saving');

  clearTimeout(_draftTimer);
  _draftTimer = setTimeout(() => {
    performDraftSave();
  }, DRAFT_DEBOUNCE_MS);
}

function performDraftSave() {
  if (!_draftCurrentId) return;
  const data = gatherCardFormData();

  // Não salva se tudo está vazio
  const hasContent = data.title || data.copy || data.notes || data.link;
  if (!hasContent && _draftCurrentId === 'new') {
    return;
  }

  try {
    localStorage.setItem(DRAFT_PREFIX + _draftCurrentId, JSON.stringify(data));
    showDraftIndicator('saved');
  } catch (e) {
    console.warn('Erro ao salvar rascunho:', e);
    showDraftIndicator('error');
  }
}

/* ───────── INDICADOR VISUAL ───────── */
function showDraftIndicator(status) {
  const ind = document.getElementById('draftIndicator');
  const txt = document.getElementById('draftIndicatorText');
  const icon = document.getElementById('draftIndicatorIcon');
  if (!ind || !txt) return;

  ind.classList.add('show');
  ind.classList.remove('saving', 'saved', 'error');

  if (status === 'saving') {
    ind.classList.add('saving');
    if (icon) icon.textContent = '⏳';
    txt.textContent = 'Salvando rascunho...';
  } else if (status === 'saved') {
    ind.classList.add('saved');
    if (icon) icon.textContent = '✓';
    const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    txt.textContent = `Rascunho salvo às ${time}`;

    // Esconde após 2.5s
    clearTimeout(_draftIndicatorTimer);
    _draftIndicatorTimer = setTimeout(() => {
      ind.classList.remove('show');
    }, 2500);
  } else if (status === 'error') {
    ind.classList.add('error');
    if (icon) icon.textContent = '⚠️';
    txt.textContent = 'Erro ao salvar';
  }
}

/* ───────── DETECTA E OFERECE RECUPERAR RASCUNHO ───────── */
function checkAndOfferDraft(cardId) {
  const key = DRAFT_PREFIX + cardId;
  const raw = localStorage.getItem(key);
  if (!raw) return false;

  try {
    const data = JSON.parse(raw);
    if (!data || !data.timestamp) return false;

    // Verifica idade
    const ageMs = Date.now() - data.timestamp;
    const ageDays = ageMs / (1000 * 60 * 60 * 24);
    if (ageDays > DRAFT_MAX_AGE_DAYS) {
      localStorage.removeItem(key);
      return false;
    }

    // Mostra banner
    const banner = document.getElementById('draftRecoverBanner');
    const info = document.getElementById('draftRecoverInfo');
    if (banner) banner.classList.add('show');
    if (info) {
      const when = new Date(data.timestamp);
      info.textContent = `Rascunho de ${when.toLocaleString('pt-BR')}`;
    }
    return true;
  } catch (e) {
    console.warn('Rascunho corrompido:', e);
    localStorage.removeItem(key);
    return false;
  }
}

/* ───────── RECUPERAR rascunho ───────── */
function recoverDraft() {
  if (!_draftCurrentId) return;
  const raw = localStorage.getItem(DRAFT_PREFIX + _draftCurrentId);
  if (!raw) return;

  try {
    const data = JSON.parse(raw);
    applyCardFormData(data);
    _draftInitialSnapshot = snapshotFormData();
    _draftDirty = false;

    const banner = document.getElementById('draftRecoverBanner');
    if (banner) banner.classList.remove('show');

    showToast('✅ Rascunho recuperado');
  } catch (e) {
    console.warn('Erro ao recuperar rascunho:', e);
    showToast('⚠️ Erro ao recuperar rascunho');
  }
}

/* ───────── DESCARTAR rascunho ───────── */
function discardDraft() {
  if (!_draftCurrentId) return;
  localStorage.removeItem(DRAFT_PREFIX + _draftCurrentId);
  const banner = document.getElementById('draftRecoverBanner');
  if (banner) banner.classList.remove('show');
  showToast('🗑️ Rascunho descartado');
}

/* ───────── INICIA O SISTEMA AO ABRIR O CARD ───────── */
function initDraftSystem(cardId, isNew = false) {
  _draftCurrentId = isNew ? 'new' : cardId;
  _draftDirty = false;

  // Aguarda DOM atualizar e captura snapshot inicial
  setTimeout(() => {
    _draftInitialSnapshot = snapshotFormData();

    // Verifica se há rascunho pra recuperar
    checkAndOfferDraft(_draftCurrentId);

    // Anexa listeners aos campos
    attachDraftListeners();
  }, 100);
}

/* ───────── ANEXA LISTENERS NOS CAMPOS ───────── */
function attachDraftListeners() {
  const fields = [
    'cardTitle', 'cardDate', 'cardCategory', 'cardPlatform',
    'cardBU', 'cardStatus', 'cardCopy', 'cardNotes', 'cardLink'
  ];
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.dataset.draftBound === '1') return;
    el.dataset.draftBound = '1';
    el.addEventListener('input', scheduleDraftSave);
    el.addEventListener('change', scheduleDraftSave);
  });
}

/* ───────── ENCERRA O SISTEMA AO FECHAR O CARD ───────── */
function endDraftSystem() {
  clearTimeout(_draftTimer);
  clearTimeout(_draftIndicatorTimer);
  _draftCurrentId = null;
  _draftDirty = false;
  _draftInitialSnapshot = '';

  const ind = document.getElementById('draftIndicator');
  if (ind) ind.classList.remove('show');
  const banner = document.getElementById('draftRecoverBanner');
  if (banner) banner.classList.remove('show');
}

/* ───────── LIMPA RASCUNHO APÓS SALVAR ───────── */
function clearDraftAfterSave(cardId) {
  // Apaga rascunho "new" e o do ID específico
  localStorage.removeItem(DRAFT_PREFIX + 'new');
  if (cardId) localStorage.removeItem(DRAFT_PREFIX + cardId);
}

/* ───────── FECHAR COM CONFIRMAÇÃO ───────── */
function tryCloseCardModal() {
  if (!_draftDirty) {
    // Sem alterações: fecha direto
    endDraftSystem();
    closeOverlay('cardOverlay');
    return;
  }

  // Tem alterações: salva rascunho e pergunta
  performDraftSave();

  const confirmed = confirm(
    '⚠️ Você tem alterações não salvas.\n\n' +
    '• OK = Sair (rascunho ficou salvo, dá pra recuperar depois)\n' +
    '• Cancelar = Continuar editando'
  );

  if (confirmed) {
    endDraftSystem();
    closeOverlay('cardOverlay');
  }
}

/* Força fechamento sem perguntar (uso interno) */
function forceCloseCardModal() {
  endDraftSystem();
  closeOverlay('cardOverlay');
}

/* ───────── LIMPEZA DE RASCUNHOS ANTIGOS (> 7 dias) ───────── */
function cleanupOldDrafts() {
  const now = Date.now();
  const maxAgeMs = DRAFT_MAX_AGE_DAYS * 24 * 60 * 60 * 1000;
  let removed = 0;

  for (let i = localStorage.length - 1; i >= 0; i--) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(DRAFT_PREFIX)) continue;

    try {
      const raw = localStorage.getItem(key);
      const data = JSON.parse(raw);
      if (!data?.timestamp || (now - data.timestamp) > maxAgeMs) {
        localStorage.removeItem(key);
        removed++;
      }
    } catch (e) {
      localStorage.removeItem(key);
      removed++;
    }
  }

  if (removed > 0) {
    console.log(`🧹 ${removed} rascunho(s) antigo(s) removido(s)`);
  }
}

/* ───────── LISTA TODOS OS RASCUNHOS (debug/futuro uso) ───────── */
function listAllDrafts() {
  const drafts = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(DRAFT_PREFIX)) continue;
    try {
      const data = JSON.parse(localStorage.getItem(key));
      drafts.push({
        id: key.replace(DRAFT_PREFIX, ''),
        ...data
      });
    } catch (e) { /* ignora */ }
  }
  return drafts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
}

/* Roda limpeza no boot */
cleanupOldDrafts();
