<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Marketing</title>
  <style>

/* ═══════════════════════════════════════════════════════════
   🎨 VARIÁVEIS DE TEMA — Light & Dark
═══════════════════════════════════════════════════════════ */
:root,
[data-theme="dark"] {
  --bg: #0f1117;
  --bg-2: #161a25;
  --bg-3: #1c2030;
  --s1: #1a1e2e;
  --s2: #232838;
  --s3: #2a3045;
  --card: #1a1e2e;
  --card-hover: #232838;
  --border: #2e3350;
  --border-soft: #252a3d;
  --text: #e6e9f5;
  --text-soft: #b8bdd1;
  --muted: #6b7399;
  --muted-2: #4a5070;
  --accent: #6c63ff;
  --accent-2: #a78bfa;
  --accent-3: #38bdf8;
  --green: #4ade80;
  --orange: #fb923c;
  --red: #f87171;
  --yellow: #facc15;
  --pink: #f472b6;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, .25);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, .35);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
  --overlay-bg: rgba(0, 0, 0, .72);
  --input-bg: #1a1e2e;
  --input-border: #2e3350;
  --input-focus: #6c63ff;
  --scrollbar-thumb: #2e3350;
  --scrollbar-track: #161a25;
  --topbar-bg: rgba(15, 17, 23, .92);
  --sidebar-bg: #161a25;
  --kbd-bg: #2a3045;
  --success-bg: rgba(74, 222, 128, .15);
  --warning-bg: rgba(251, 146, 60, .15);
  --danger-bg: rgba(248, 113, 113, .15);
  --info-bg: rgba(56, 189, 248, .15);
  --draft-bg: rgba(108, 99, 255, .12);
  --draft-border: rgba(108, 99, 255, .35);
  --event-glow: 0 0 0 2px rgba(244, 114, 182, .35);
}

[data-theme="light"] {
  --bg: #f5f7fb;
  --bg-2: #ffffff;
  --bg-3: #eef1f8;
  --s1: #ffffff;
  --s2: #f0f3fa;
  --s3: #e4e9f3;
  --card: #ffffff;
  --card-hover: #f5f7fb;
  --border: #d8deea;
  --border-soft: #e4e9f3;
  --text: #1a1e2e;
  --text-soft: #3a4060;
  --muted: #6b7399;
  --muted-2: #8a90b0;
  --accent: #6c63ff;
  --accent-2: #8b7cf6;
  --accent-3: #0ea5e9;
  --green: #16a34a;
  --orange: #ea580c;
  --red: #dc2626;
  --yellow: #ca8a04;
  --pink: #db2777;
  --shadow-sm: 0 2px 8px rgba(20, 24, 50, .06);
  --shadow-md: 0 6px 20px rgba(20, 24, 50, .10);
  --shadow-lg: 0 12px 40px rgba(20, 24, 50, .15);
  --overlay-bg: rgba(20, 24, 50, .45);
  --input-bg: #ffffff;
  --input-border: #d8deea;
  --input-focus: #6c63ff;
  --scrollbar-thumb: #c5cdd9;
  --scrollbar-track: #eef1f8;
  --topbar-bg: rgba(255, 255, 255, .92);
  --sidebar-bg: #ffffff;
  --kbd-bg: #e4e9f3;
  --success-bg: rgba(22, 163, 74, .10);
  --warning-bg: rgba(234, 88, 12, .10);
  --danger-bg: rgba(220, 38, 38, .10);
  --info-bg: rgba(14, 165, 233, .10);
  --draft-bg: rgba(108, 99, 255, .08);
  --draft-border: rgba(108, 99, 255, .30);
  --event-glow: 0 0 0 2px rgba(219, 39, 119, .25);
}

/* ═══════════════════════════════════════════════════════════
   🔧 RESET & BASE
═══════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  transition: background .25s ease, color .25s ease;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

/* ═══════════════════════════════════════════════════════════
   🌅 LOADING SCREEN
═══════════════════════════════════════════════════════════ */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  flex-direction: column;
  gap: 18px;
}
.loading-spinner {
  width: 50px;
  height: 50px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--muted); font-size: .9rem; }

/* ═══════════════════════════════════════════════════════════
   🏠 APP SHELL
═══════════════════════════════════════════════════════════ */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ═══════════════════════════════════════════════════════════
   📑 SIDEBAR
═══════════════════════════════════════════════════════════ */
.sidebar {
  width: 260px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  transition: transform .25s ease;
  z-index: 50;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px 14px;
  border-bottom: 1px solid var(--border-soft);
}
.sidebar-brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  box-shadow: var(--shadow-sm);
}
.sidebar-brand-text { font-size: .95rem; font-weight: 700; }
.sidebar-brand-sub { font-size: .68rem; color: var(--muted); }

.sidebar-section { display: flex; flex-direction: column; gap: 6px; }
.sidebar-label {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted-2);
  padding: 0 8px;
  margin-top: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: .85rem;
  font-weight: 500;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .15s ease;
  user-select: none;
}
.nav-item:hover { background: var(--card-hover); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(108, 99, 255, .18), rgba(167, 139, 250, .12));
  color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(108, 99, 255, .25);
}
.nav-item-icon { font-size: 1rem; }

.mlist-a {
  display: block;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: .8rem;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .15s ease;
}
.mlist-a:hover { background: var(--card-hover); color: var(--text); }

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .5);
  z-index: 40;
}
.sidebar-overlay.open { display: block; }

/* ═══════════════════════════════════════════════════════════
   📂 CATEGORIAS NA SIDEBAR
═══════════════════════════════════════════════════════════ */
.cat-list { display: flex; flex-direction: column; gap: 3px; }
.cat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border-radius: 8px;
  font-size: .78rem;
  cursor: pointer;
  transition: background .15s ease;
}
.cat-item:hover { background: var(--card-hover); }
.cat-emoji { font-size: .95rem; }
.cat-swatch {
  width: 12px;
  height: 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.cat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-edit-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: .8rem;
  opacity: 0;
  transition: opacity .15s ease;
  padding: 2px 4px;
  border-radius: 4px;
}
.cat-item:hover .cat-edit-btn { opacity: 1; }
.cat-edit-btn:hover { background: var(--s3); color: var(--text); }

.btn-cat-add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  border-radius: 8px;
  background: var(--s2);
  border: 1px dashed var(--border);
  color: var(--muted);
  font-size: .78rem;
  font-weight: 600;
  transition: all .15s ease;
}
.btn-cat-add:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(108, 99, 255, .08);
}

/* ═══════════════════════════════════════════════════════════
   🧭 TOPBAR
═══════════════════════════════════════════════════════════ */
.main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--topbar-bg);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 12px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.topbar-year {
  font-size: .82rem;
  color: var(--accent-2);
  background: rgba(108, 99, 255, .12);
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 600;
}

.topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.topbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 9px;
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text-soft);
  font-size: .78rem;
  font-weight: 600;
  transition: all .15s ease;
}
.topbar-btn:hover {
  background: var(--s3);
  color: var(--text);
  transform: translateY(-1px);
}

.year-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 3px;
}
.year-nav button {
  background: none;
  border: none;
  color: var(--text-soft);
  padding: 4px 9px;
  border-radius: 6px;
  font-size: .85rem;
}
.year-nav button:hover { background: var(--s3); color: var(--text); }
.year-nav span { font-size: .82rem; font-weight: 700; min-width: 42px; text-align: center; }

/* 🌓 Theme Toggle */
.theme-toggle {
  display: inline-flex;
  align-items: center;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 3px;
  cursor: pointer;
  position: relative;
  width: 64px;
  height: 28px;
}
.theme-toggle-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .75rem;
  transition: transform .25s cubic-bezier(.4, 0, .2, 1);
  box-shadow: var(--shadow-sm);
}
[data-theme="light"] .theme-toggle-thumb { transform: translateX(36px); }
.theme-toggle-icons {
  display: flex;
  justify-content: space-between;
  width: 100%;
  padding: 0 6px;
  font-size: .7rem;
  align-items: center;
  color: var(--muted);
}

/* 🔔 Event Badge no topbar */
.event-badge-topbar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: linear-gradient(135deg, rgba(244, 114, 182, .18), rgba(167, 139, 250, .15));
  border: 1px solid rgba(244, 114, 182, .35);
  border-radius: 22px;
  font-size: .76rem;
  font-weight: 600;
  color: var(--pink);
  cursor: pointer;
  transition: all .15s ease;
  position: relative;
}
.event-badge-topbar:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(244, 114, 182, .25);
}
.event-badge-topbar .pulse-dot {
  width: 8px;
  height: 8px;
  background: var(--pink);
  border-radius: 50%;
  animation: pulse 1.6s infinite ease-in-out;
}
.event-badge-topbar.empty { display: none; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, .6); }
  50% { box-shadow: 0 0 0 8px rgba(244, 114, 182, 0); }
}

.event-badge-count {
  background: var(--pink);
  color: #fff;
  font-size: .65rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

/* Sync dot */
.sync-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--muted);
  transition: background .2s ease, box-shadow .2s ease;
}
.sync-dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(74, 222, 128, .45); }
.sync-dot.err { background: var(--red); box-shadow: 0 0 8px rgba(248, 113, 113, .45); }

.btn-mobile-toggle {
  display: none;
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 9px;
  padding: 7px 10px;
}

/* ═══════════════════════════════════════════════════════════
   🔍 FILTER BAR
═══════════════════════════════════════════════════════════ */
.filter-bar {
  padding: 14px 22px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.filter-bar.hidden { display: none; }

.filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.filter-row-label {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted-2);
  min-width: 80px;
}

.search-wrap {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 10px;
  padding: 9px 12px 9px 36px;
  color: var(--text);
  font-size: .85rem;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.search-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108, 99, 255, .15);
}
.search-wrap::before {
  content: "🔍";
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: .85rem;
  opacity: .6;
}

.filter-chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 18px;
  font-size: .75rem;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .15s ease;
  user-select: none;
}
.filter-chip:hover { background: var(--s3); color: var(--text); }
.filter-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.filter-chip-person {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 4px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 18px;
  font-size: .75rem;
  cursor: pointer;
  position: relative;
  transition: all .15s ease;
}
.filter-chip-person:hover { background: var(--s3); }
.filter-chip-person.active { background: var(--card-hover); }
.fcp-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .62rem;
  font-weight: 700;
  color: #fff;
}
.filter-chip-person-del {
  background: none;
  border: none;
  color: var(--muted);
  font-size: .65rem;
  padding: 0 0 0 3px;
  opacity: 0;
  transition: opacity .15s ease;
}
.filter-chip-person:hover .filter-chip-person-del { opacity: 1; }
.filter-chip-person-del:hover { color: var(--red); }

.add-resp-row { display: flex; gap: 6px; align-items: center; }
.add-resp-row input {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 7px;
  padding: 5px 10px;
  font-size: .75rem;
  color: var(--text);
  width: 140px;
}
.add-resp-row input:focus { outline: none; border-color: var(--accent); }
.add-resp-row button {
  background: var(--accent);
  border: none;
  color: #fff;
  border-radius: 7px;
  padding: 5px 12px;
  font-size: .72rem;
  font-weight: 600;
}

/* ═══════════════════════════════════════════════════════════
   📅 CALENDÁRIO
═══════════════════════════════════════════════════════════ */
.main-content {
  padding: 20px 22px 40px;
  flex: 1;
}
.main-content.hidden { display: none; }

.month-section { margin-bottom: 32px; }

.month-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 14px;
  padding: 12px 16px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  flex-wrap: wrap;
}
.month-left { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
.month-title-row { display: flex; align-items: center; gap: 10px; }
.month-title { font-size: 1.15rem; font-weight: 700; }
.month-cnt {
  font-size: .7rem;
  color: var(--muted);
  background: var(--s2);
  padding: 3px 9px;
  border-radius: 12px;
  font-weight: 600;
}

.month-status-dots { display: flex; flex-wrap: wrap; gap: 6px; }
.mstatus-dot {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  background: var(--s2);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  font-size: .68rem;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .15s ease;
}
.mstatus-dot:hover { background: var(--s3); }
.mstatus-dot.active-filter {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.mstatus-circle { width: 7px; height: 7px; border-radius: 50%; }

.month-right-btns { display: flex; gap: 8px; align-items: center; }
.btn-excel, .btn-add-main {
  padding: 7px 14px;
  border-radius: 9px;
  font-size: .76rem;
  font-weight: 600;
  border: none;
  transition: all .15s ease;
}
.btn-excel {
  background: var(--s2);
  color: var(--text-soft);
  border: 1px solid var(--border);
}
.btn-excel:hover { background: var(--green); color: #fff; border-color: var(--green); }
.btn-add-main {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: var(--shadow-sm);
}
.btn-add-main:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

/* Grid de dias */
.cal-wrap {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border-soft);
}
.cal-hcell {
  background: var(--s2);
  padding: 9px 6px;
  text-align: center;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--muted);
  text-transform: uppercase;
}
.cal-day {
  background: var(--bg-2);
  min-height: 130px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: relative;
  transition: background .15s ease;
}
.cal-day.empty { background: var(--bg); opacity: .35; }
.cal-day.today { background: linear-gradient(180deg, rgba(108, 99, 255, .08), transparent 60%); }
.cal-day.today .day-num {
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
.cal-day.holiday { background: linear-gradient(180deg, rgba(244, 114, 182, .08), transparent 60%); }
.cal-day.drag-over {
  background: rgba(108, 99, 255, .12);
  outline: 2px dashed var(--accent);
  outline-offset: -3px;
}
.cal-day.highlight-pulse { animation: highlightPulse 1.5s ease; }
@keyframes highlightPulse {
  0% { background: var(--bg-2); }
  30% { background: rgba(74, 222, 128, .25); }
  100% { background: var(--bg-2); }
}

.day-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.day-num {
  font-size: .85rem;
  font-weight: 600;
  color: var(--text-soft);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  transition: background .15s ease;
}
.day-num:hover { background: var(--s2); color: var(--text); }
.holiday-tag {
  font-size: .58rem;
  background: rgba(244, 114, 182, .15);
  color: var(--pink);
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90px;
}

.day-cards-area {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 180px;
  overflow-y: auto;
  padding-right: 2px;
}
.day-cards-area::-webkit-scrollbar { width: 4px; }

.day-add-btn {
  position: absolute;
  bottom: 5px;
  right: 5px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: .8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: all .15s ease;
}
.cal-day:hover .day-add-btn { opacity: 1; }
.day-add-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  transform: scale(1.15);
}

/* Cards no calendário */
.content-card {
  background: var(--card);
  border-left: 3px solid var(--accent);
  border-radius: 7px;
  padding: 6px 8px;
  font-size: .72rem;
  cursor: pointer;
  transition: all .15s ease;
  user-select: none;
}
.content-card:hover {
  transform: translateX(2px);
  box-shadow: var(--shadow-sm);
}
.content-card.dragging { opacity: .5; }
.content-card.is-recur { border-style: dashed; }
.content-card.status-done { opacity: .6; }
.content-card.status-done .card-title { text-decoration: line-through; }

.card-main-row { display: flex; align-items: center; gap: 5px; }
.card-cat-emoji { font-size: .85rem; }
.card-plat-icon { font-size: .8rem; opacity: .85; }
.card-inner { flex: 1; min-width: 0; }
.card-title {
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .73rem;
}
.card-sub {
  font-size: .62rem;
  color: var(--muted);
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.card-avatars { display: flex; gap: -3px; }
.card-avatar {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .55rem;
  font-weight: 700;
  color: #fff;
  margin-left: -4px;
  border: 1.5px solid var(--card);
}
.card-recur { font-size: .68rem; opacity: .7; }

.card-checklist-bar {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 4px;
}
.card-cl-prog {
  flex: 1;
  height: 3px;
  background: var(--s3);
  border-radius: 2px;
  overflow: hidden;
}
.card-cl-fill { height: 100%; transition: width .25s ease; }
.card-cl-label { font-size: .58rem; color: var(--muted); font-weight: 600; }

/* 🎉 Card especial de Evento */
.content-card.is-event {
  background: linear-gradient(135deg, rgba(244, 114, 182, .12), rgba(167, 139, 250, .08));
  border-left-width: 4px;
  border-left-color: var(--pink);
  box-shadow: var(--event-glow);
  position: relative;
}
.content-card.is-event::before {
  content: "🎉";
  position: absolute;
  top: -4px;
  right: -4px;
  font-size: .75rem;
  background: var(--bg-2);
  border-radius: 50%;
  padding: 1px 3px;
  border: 1.5px solid var(--pink);
}

/* ═══════════════════════════════════════════════════════════
   🪟 MODAIS — Estrutura Base
═══════════════════════════════════════════════════════════ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  animation: fadeIn .2s ease;
}
.overlay.open { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  width: 100%;
  max-width: 580px;
  box-shadow: var(--shadow-lg);
  animation: slideUp .25s ease;
  margin: auto 0;
}
.modal-md { max-width: 720px; }
.modal-lg { max-width: 880px; }
.modal-sm { max-width: 420px; }

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-soft);
}
.modal-header h2 { font-size: 1.1rem; font-weight: 700; margin: 0; }
.modal-close {
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text-soft);
  width: 32px;
  height: 32px;
  border-radius: 9px;
  font-size: .9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s ease;
}
.modal-close:hover {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
  transform: rotate(90deg);
}

/* Abas do modal */
.modal-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border-soft);
  overflow-x: auto;
  padding-bottom: 0;
}
.modal-tab {
  background: none;
  border: none;
  color: var(--muted);
  padding: 9px 14px;
  font-size: .8rem;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  transition: all .15s ease;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}
.modal-tab:hover { color: var(--text); background: var(--card-hover); border-top-left-radius: 8px; border-top-right-radius: 8px; }
.modal-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab-panel { display: none; }
.tab-panel.active { display: block; animation: tabFadeIn .25s ease; }
@keyframes tabFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 📏 NOVO: espaçamento generoso entre campos */
.fgrp {
  margin-bottom: 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fgrp:last-child { margin-bottom: 0; }
.fgrp label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .78rem;
  font-weight: 600;
  color: var(--text-soft);
  letter-spacing: .01em;
}

.req-badge, .opt-badge {
  font-size: .58rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.req-badge { background: rgba(248, 113, 113, .15); color: var(--red); }
.opt-badge { background: var(--s2); color: var(--muted); }

.fgrp input[type="text"],
.fgrp input[type="url"],
.fgrp input[type="number"],
.fgrp input[type="date"],
.fgrp input[type="email"],
.fgrp textarea,
.fgrp select {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--text);
  font-size: .85rem;
  transition: all .15s ease;
}
.fgrp input:focus,
.fgrp textarea:focus,
.fgrp select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108, 99, 255, .15);
}
.fgrp textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.fgrp input.invalid, .fgrp textarea.invalid {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(248, 113, 113, .12);
}

.err-msg {
  display: none;
  font-size: .7rem;
  color: var(--red);
  margin-top: -2px;
}
.err-msg.show { display: block; }

.hint {
  font-size: .68rem;
  color: var(--muted);
  margin-top: -2px;
}

.input-action-btn {
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text-soft);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: .72rem;
  font-weight: 600;
  transition: all .15s ease;
  white-space: nowrap;
}
.input-action-btn:hover { background: var(--s3); color: var(--text); }

/* Tag pickers (plataforma / bu) */
.tag-picker-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 4px 0;
}
.tag-pick-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 18px;
  font-size: .75rem;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .15s ease;
  user-select: none;
}
.tag-pick-item:hover {
  background: var(--s3);
  border-color: var(--accent);
  color: var(--text);
}
.tag-pick-item.sel {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.bu-item.sel { background: var(--pink); border-color: var(--pink); }

/* Caixa de gerenciamento (plataforma/BU) */
.manage-items-box {
  margin-top: 10px;
  padding: 14px;
  background: var(--s1);
  border: 1px dashed var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.manage-items-title {
  font-size: .73rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.manage-items-list { display: flex; flex-direction: column; gap: 6px; }
.manage-item-row,
.plat-manage-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: var(--bg-2);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
}
.manage-item-name { flex: 1; font-size: .8rem; }
.plat-manage-emoji {
  font-size: 1.05rem;
  cursor: pointer;
  padding: 4px 7px;
  border-radius: 7px;
  background: var(--s2);
  border: 1px solid var(--border);
  min-width: 34px;
  text-align: center;
  transition: all .15s ease;
}
.plat-manage-emoji:hover { background: var(--accent); color: #fff; }
.plat-edit-input {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 7px;
  padding: 6px 10px;
  font-size: .78rem;
  color: var(--text);
}
.plat-edit-input:focus { outline: none; border-color: var(--accent); }
.manage-item-del, .imp-item-del {
  background: none;
  border: none;
  color: var(--muted);
  font-size: .8rem;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all .15s ease;
}
.manage-item-del:hover, .imp-item-del:hover { background: var(--red); color: #fff; }

.manage-add-row {
  display: flex;
  gap: 7px;
  align-items: center;
  padding-top: 8px;
  border-top: 1px solid var(--border-soft);
}
.manage-add-row input {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 7px;
  padding: 7px 10px;
  font-size: .78rem;
  color: var(--text);
}
.manage-add-row input:focus { outline: none; border-color: var(--accent); }
.manage-add-row button {
  background: var(--accent);
  border: none;
  color: #fff;
  border-radius: 7px;
  padding: 7px 14px;
  font-size: .75rem;
  font-weight: 600;
}

/* Emoji inline panel (fix do bug) */
.emoji-inline-panel {
  display: none;
  margin-top: 8px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  max-height: 200px;
  overflow-y: auto;
}
.emoji-inline-panel.open { display: block; animation: tabFadeIn .2s ease; }
.emoji-inline-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 4px;
}
.emoji-inline-btn {
  background: var(--bg-2);
  border: 1px solid var(--border-soft);
  border-radius: 7px;
  padding: 6px;
  font-size: 1.05rem;
  cursor: pointer;
  transition: all .15s ease;
}
.emoji-inline-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(1.15);
}

/* Preview de cor da categoria */
.cat-color-preview {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--s1);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  margin-top: 4px;
}
.cat-color-swatch {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 2px solid var(--border);
  flex-shrink: 0;
}
.cat-color-info { display: flex; flex-direction: column; gap: 2px; font-size: .78rem; }
.cat-color-info strong { color: var(--text); }
.cat-color-info span { color: var(--muted); font-family: monospace; font-size: .7rem; }

/* Override de cor */
.override-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: .78rem;
  cursor: pointer;
  color: var(--text-soft);
}
.override-toggle input { cursor: pointer; }

.override-section {
  display: none;
  margin-top: 10px;
  padding: 14px;
  background: var(--s1);
  border: 1px dashed var(--border);
  border-radius: 12px;
}
.override-section.show { display: block; animation: tabFadeIn .2s ease; }

.color-pick-area { display: flex; flex-direction: column; gap: 12px; }
.preset-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
  gap: 6px;
}
.pdot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all .15s ease;
}
.pdot:hover { transform: scale(1.15); }
.pdot.sel {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--accent);
  transform: scale(1.15);
}
.custom-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: .78rem;
  color: var(--text-soft);
}
.custom-row input[type="color"] {
  width: 38px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: none;
  cursor: pointer;
}
.color-bar {
  height: 10px;
  border-radius: 6px;
  border: 1px solid var(--border-soft);
}

/* Status options */
.status-sel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 6px;
}
.status-opt {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 11px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: .77rem;
  cursor: pointer;
  color: var(--text-soft);
  transition: all .15s ease;
  user-select: none;
}
.status-opt:hover { background: var(--s3); }
.s-dot { width: 8px; height: 8px; border-radius: 50%; }

.status-opt.sel-pendente { background: rgba(249, 115, 22, .18); border-color: var(--orange); color: var(--orange); }
.status-opt.sel-produção { background: rgba(56, 189, 248, .18); border-color: var(--accent-3); color: var(--accent-3); }
.status-opt.sel-revisão { background: rgba(167, 139, 250, .18); border-color: var(--accent-2); color: var(--accent-2); }
.status-opt.sel-aprovado { background: rgba(74, 222, 128, .18); border-color: var(--green); color: var(--green); }
.status-opt.sel-publicado { background: rgba(108, 99, 255, .18); border-color: var(--accent); color: var(--accent); }
.status-opt.sel-programado { background: rgba(14, 165, 233, .18); border-color: var(--accent-3); color: var(--accent-3); }

/* Recorrência */
.recur-opts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 6px;
}
.recur-opt {
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 8px 11px;
  border-radius: 9px;
  font-size: .76rem;
  cursor: pointer;
  transition: all .15s ease;
}
.recur-opt:hover { background: var(--s3); }
.recur-opt.sel {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

/* People picker */
.people-picker { position: relative; }
.people-display {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 12px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 9px;
  cursor: pointer;
  min-height: 42px;
  transition: border-color .15s ease;
}
.people-display:hover { border-color: var(--accent); }
.people-sel-tags { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.people-placeholder { color: var(--muted); font-size: .82rem; }
.people-arrow { font-size: .65rem; color: var(--muted); }
.people-sel-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px 3px 3px;
  border-radius: 14px;
  font-size: .72rem;
  font-weight: 600;
}
.people-sel-tag-avatar {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .58rem;
  color: #fff;
}
.people-sel-tag-remove {
  background: none;
  border: none;
  color: inherit;
  opacity: .6;
  font-size: .65rem;
  padding: 0 2px;
}
.people-sel-tag-remove:hover { opacity: 1; }

.people-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 11px;
  z-index: 10;
  box-shadow: var(--shadow-md);
  max-height: 280px;
  overflow: hidden;
  flex-direction: column;
}
.people-dropdown.open { display: flex; }
.people-list { flex: 1; overflow-y: auto; padding: 6px; }
.people-empty { padding: 12px; text-align: center; color: var(--muted); font-size: .78rem; }
.people-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .15s ease;
}
.people-opt:hover { background: var(--card-hover); }
.people-opt.selected { background: rgba(108, 99, 255, .12); }
.people-opt-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .65rem;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.people-opt-name { flex: 1; font-size: .82rem; }
.people-opt-check { color: var(--accent); font-weight: 700; }

.people-add-row {
  display: flex;
  gap: 6px;
  padding: 8px;
  border-top: 1px solid var(--border-soft);
  background: var(--s1);
}
.people-add-row input {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 7px;
  padding: 6px 10px;
  font-size: .78rem;
  color: var(--text);
}
.people-add-row input:focus { outline: none; border-color: var(--accent); }
.people-add-btn {
  background: var(--accent);
  border: none;
  color: #fff;
  border-radius: 7px;
  padding: 6px 12px;
  font-size: .72rem;
  font-weight: 600;
}

/* Tags */
.tags-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 9px;
  padding: 7px 10px;
  min-height: 42px;
  cursor: text;
}
.tags-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 99, 255, .15); }
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(108, 99, 255, .15);
  border: 1px solid rgba(108, 99, 255, .3);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 12px;
  font-size: .72rem;
  font-weight: 500;
}
.tag-chip button {
  background: none;
  border: none;
  color: inherit;
  padding: 0;
  font-size: .65rem;
  opacity: .6;
}
.tag-chip button:hover { opacity: 1; }
.tag-chip-sm {
  display: inline-block;
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: .68rem;
}
.tags-input {
  flex: 1;
  min-width: 100px;
  background: none;
  border: none;
  color: var(--text);
  font-size: .8rem;
  outline: none;
}

/* Upload area */
.upload-area {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 22px;
  text-align: center;
  cursor: pointer;
  transition: all .15s ease;
  background: var(--s1);
}
.upload-area:hover {
  border-color: var(--accent);
  background: rgba(108, 99, 255, .05);
}
.upload-area input[type="file"] { display: none; }
.upload-area-label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: center;
  color: var(--text-soft);
  font-size: .82rem;
}
.upload-area-label span:first-child { font-size: 1.5rem; }

.ref-files-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.ref-file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--s2);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  font-size: .77rem;
}
.ref-file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-file-del {
  background: none;
  border: none;
  color: var(--muted);
  font-size: .75rem;
  padding: 2px 6px;
  border-radius: 5px;
}
.ref-file-del:hover { background: var(--red); color: #fff; }

/* Section title dentro do modal */
.content-section-title {
  font-size: .8rem;
  font-weight: 700;
  color: var(--accent-2);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 16px 0 10px;
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.content-section-title:first-child { padding-top: 0; }

/* Checklist */
.cl-progress-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--s1);
  border-radius: 9px;
  margin-bottom: 12px;
}
.cl-progress-bar {
  flex: 1;
  height: 6px;
  background: var(--s3);
  border-radius: 4px;
  overflow: hidden;
}
.cl-progress-fill { height: 100%; transition: width .3s ease; }
.cl-progress-label {
  font-size: .72rem;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}

.cl-list { display: flex; flex-direction: column; gap: 6px; }
.cl-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--s2);
  border: 1px solid var(--border-soft);
  border-radius: 9px;
}
.cl-row.done-row { opacity: .6; }
.cl-checkbox {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--border);
  background: var(--bg-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: .7rem;
  color: #fff;
  font-weight: 700;
  transition: all .15s ease;
}
.cl-checkbox.on { background: var(--green); border-color: var(--green); }
.cl-checkbox:hover { border-color: var(--accent); }
.cl-input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-size: .82rem;
  outline: none;
}
.cl-row.done-row .cl-input { text-decoration: line-through; color: var(--muted); }
.cl-del-btn {
  background: none;
  border: none;
  color: var(--muted);
  padding: 4px 6px;
  border-radius: 5px;
  font-size: .75rem;
}
.cl-del-btn:hover { background: var(--red); color: #fff; }

.cl-add-btn {
  margin-top: 8px;
  background: var(--s2);
  border: 1px dashed var(--border);
  color: var(--muted);
  padding: 8px;
  border-radius: 9px;
  font-size: .77rem;
  font-weight: 600;
  width: 100%;
  transition: all .15s ease;
}
.cl-add-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(108, 99, 255, .05);
}

/* Links */
.links-list { display: flex; flex-direction: column; gap: 6px; }
.link-row-item {
  display: flex;
  gap: 6px;
  align-items: center;
}
.link-row-item input {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: .78rem;
  color: var(--text);
}
.link-row-item .link-name { width: 35%; }
.link-row-item input[type="url"] { flex: 1; }
.link-row-item input:focus { outline: none; border-color: var(--accent); }
.link-del-btn {
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 10px;
  border-radius: 7px;
  font-size: .72rem;
}
.link-del-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }

.add-link-btn {
  margin-top: 8px;
  background: var(--s2);
  border: 1px dashed var(--border);
  color: var(--muted);
  padding: 8px;
  border-radius: 9px;
  font-size: .77rem;
  font-weight: 600;
  width: 100%;
  transition: all .15s ease;
}
.add-link-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Actions do modal */
.mactions {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
  flex-wrap: wrap;
}
.btn-cancel, .btn-save, .btn-del, .btn-dup, .btn-back, .btn-comment {
  padding: 9px 16px;
  border-radius: 9px;
  font-size: .82rem;
  font-weight: 600;
  border: none;
  transition: all .15s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn-cancel {
  background: var(--s2);
  color: var(--text-soft);
  border: 1px solid var(--border);
}
.btn-cancel:hover { background: var(--s3); }
.btn-save {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: var(--shadow-sm);
}
.btn-save:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-save:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.btn-del {
  background: rgba(248, 113, 113, .12);
  color: var(--red);
  border: 1px solid rgba(248, 113, 113, .3);
}
.btn-del:hover { background: var(--red); color: #fff; }
.btn-dup {
  background: rgba(167, 139, 250, .12);
  color: var(--accent-2);
  border: 1px solid rgba(167, 139, 250, .3);
}
.btn-dup:hover { background: var(--accent-2); color: #fff; }
.btn-back {
  background: var(--s2);
  color: var(--text-soft);
  border: 1px solid var(--border);
  margin-right: auto;
}
.btn-back:hover { background: var(--s3); }
.btn-comment {
  background: var(--accent-2);
  color: #fff;
  width: 100%;
  justify-content: center;
}

/* 💾 INDICADOR DE RASCUNHO */
.draft-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .7rem;
  color: var(--muted);
  padding: 4px 9px;
  background: var(--draft-bg);
  border: 1px solid var(--draft-border);
  border-radius: 12px;
  margin-right: auto;
  transition: all .25s ease;
  opacity: 0;
  transform: translateY(4px);
}
.draft-indicator.show { opacity: 1; transform: translateY(0); }
.draft-indicator.saving { color: var(--accent); }
.draft-indicator.saved { color: var(--green); }
.draft-indicator .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: blinkDot 1.4s infinite;
}
@keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* Faixa de "Rascunho recuperável" no topo do modal */
.draft-recover-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(250, 204, 21, .15), rgba(251, 146, 60, .10));
  border: 1px solid rgba(250, 204, 21, .35);
  border-radius: 11px;
  margin-bottom: 16px;
  animation: slideDown .3s ease;
}
.draft-recover-banner.show { display: flex; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.draft-recover-icon { font-size: 1.4rem; }
.draft-recover-text { flex: 1; font-size: .8rem; color: var(--text); }
.draft-recover-text strong { color: var(--yellow); display: block; margin-bottom: 2px; }
.draft-recover-text span { color: var(--muted); font-size: .7rem; }
.draft-recover-btns { display: flex; gap: 6px; }
.draft-btn-recover, .draft-btn-discard {
  padding: 7px 12px;
  border-radius: 8px;
  font-size: .73rem;
  font-weight: 600;
  border: none;
  transition: all .15s ease;
}
.draft-btn-recover { background: var(--accent); color: #fff; }
.draft-btn-recover:hover { background: var(--accent-2); }
.draft-btn-discard {
  background: var(--s2);
  color: var(--muted);
  border: 1px solid var(--border);
}
.draft-btn-discard:hover { background: var(--red); color: #fff; border-color: var(--red); }

   🎉 MODAL DE BOAS-VINDAS — EVENTOS

}

.welcome-go-btn {

.priority-section-label, .done-section-label {

.priority-section-label span, .done-section-label span {

.day-cards-list { display: flex; flex-direction: column; gap: 7px; }

/* ═══════════════════════════════════════════════════════════
   📖 MODAL DETALHE
═══════════════════════════════════════════════════════════ */

.detail-blocks { display: flex; flex-direction: column; gap: 14px; }
.dblock {
  padding: 12px 14px;
  background: var(--s1);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
}
.dblock-lbl {
  font-size: .67rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin-bottom: 5px;
}
.dblock-val { font-size: .83rem; color: var(--text); line-height: 1.5; word-break: break-word; }

.resp-badges-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.resp-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px 3px 3px;
  border-radius: 14px;
  font-size: .73rem;
  font-weight: 600;
}
.resp-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .58rem;
  color: #fff;
  font-weight: 700;
}

/* Checklist detalhe */
.detail-cl-list { display: flex; flex-direction: column; gap: 5px; }
.detail-cl-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--s1);
  border-radius: 8px;
}
.detail-cl-check {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--border);
  background: var(--bg-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: .7rem;
  color: #fff;
}
.detail-cl-check.on { background: var(--green); border-color: var(--green); }
.detail-cl-text { flex: 1; font-size: .82rem; cursor: pointer; }
.detail-cl-text.done { text-decoration: line-through; color: var(--muted); }
.detail-cl-del {
  background: none;
  border: none;
  color: var(--muted);
  padding: 3px 7px;
  border-radius: 5px;
}
.detail-cl-del:hover { background: var(--red); color: #fff; }

/* Links detalhe */
.detail-links-list { display: flex; flex-direction: column; gap: 6px; }
.detail-link-item {
  padding: 9px 12px;
  background: var(--s1);
  border: 1px solid var(--border-soft);
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.detail-link-name { font-size: .72rem; font-weight: 700; color: var(--muted); }
.detail-link-item a {
  font-size: .8rem;
  color: var(--accent-3);
  word-break: break-all;
  text-decoration: none;
}
.detail-link-item a:hover { text-decoration: underline; }

/* Comentários */
.comments-area {
  max-height: 320px;
  overflow-y: auto;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
}
.comment-empty {
  text-align: center;
  color: var(--muted);
  font-size: .82rem;
  padding: 22px 0;
}
.comment-item {
  background: var(--s1);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 10px 12px;
}
.comment-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
}
.comment-author { font-size: .78rem; font-weight: 700; color: var(--accent-2); }
.comment-time { font-size: .68rem; color: var(--muted); }
.comment-edited { font-size: .65rem; color: var(--muted); font-style: italic; }
.comment-edit-btn, .comment-del {
  background: none;
  border: none;
  color: var(--muted);
  padding: 2px 5px;
  border-radius: 5px;
  font-size: .72rem;
}
.comment-edit-btn:hover { background: var(--accent); color: #fff; }
.comment-del:hover { background: var(--red); color: #fff; }
.comment-text { font-size: .83rem; color: var(--text); white-space: pre-wrap; line-height: 1.5; }

.comment-edit-wrap { display: flex; flex-direction: column; gap: 7px; }
.comment-edit-inp {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 10px;
  color: var(--text);
  font-size: .82rem;
  font-family: inherit;
  min-height: 60px;
  resize: vertical;
}
.comment-edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
.comment-edit-cancel, .comment-edit-save {
  padding: 5px 11px;
  border-radius: 7px;
  font-size: .73rem;
  font-weight: 600;
  border: none;
}
.comment-edit-cancel { background: var(--s2); color: var(--text-soft); }
.comment-edit-save { background: var(--accent); color: #fff; }

.add-comment-wrap {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
}
.add-comment-wrap input,
.add-comment-wrap textarea {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: 8px 11px;
  color: var(--text);
  font-size: .82rem;
}
.add-comment-wrap input:focus, .add-comment-wrap textarea:focus {
  outline: none; border-color: var(--accent);
}
.add-comment-wrap textarea { min-height: 70px; resize: vertical; font-family: inherit; }

/* ═══════════════════════════════════════════════════════════
   📊 DASHBOARD
═══════════════════════════════════════════════════════════ */
#dashContent {
  display: none;
  padding: 22px;
  flex: 1;
}
#dashContent.active { display: block; }

.dash-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
  gap: 14px;
  flex-wrap: wrap;
}
.dash-topbar h2 { font-size: 1.3rem; font-weight: 800; margin: 0; }
.dash-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.dash-year-sel {
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px;
  border-radius: 9px;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
}
.dash-year-sel:focus { outline: none; border-color: var(--accent); }

.dash-platform-tabs {
  display: flex;
  gap: 4px;
  background: var(--s2);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.dash-plat-tab {
  background: none;
  border: none;
  color: var(--text-soft);
  padding: 6px 14px;
  border-radius: 7px;
  font-size: .77rem;
  font-weight: 600;
  transition: all .15s ease;
}
.dash-plat-tab:hover { background: var(--s3); color: var(--text); }
.dash-plat-tab.active-ig { background: linear-gradient(135deg, #e1306c, #f472b6); color: #fff; }
.dash-plat-tab.active-yt { background: linear-gradient(135deg, #ff0000, #ff6b6b); color: #fff; }

.month-tabs-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 22px;
  background: var(--s1);
  padding: 5px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.month-tab-btn {
  background: none;
  border: none;
  color: var(--text-soft);
  padding: 6px 13px;
  border-radius: 7px;
  font-size: .77rem;
  font-weight: 600;
  transition: all .15s ease;
}
.month-tab-btn:hover { background: var(--s3); color: var(--text); }
.month-tab-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: var(--shadow-sm);
}

.dash-section { margin-bottom: 28px; }
.dash-section-title {
  font-size: .9rem;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text);
}

.metrics-input-panel {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
}
.metrics-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}
.metrics-month-title { font-size: 1.05rem; font-weight: 700; }
.metrics-month-sub { font-size: .75rem; color: var(--muted); margin-top: 2px; }

.dash-save-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 9px;
  font-size: .8rem;
  font-weight: 700;
  transition: all .15s ease;
}
.dash-save-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.dash-save-btn:disabled { opacity: .6; cursor: not-allowed; }

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}
.metric-field { display: flex; flex-direction: column; gap: 5px; }
.metric-field label { font-size: .73rem; color: var(--text-soft); font-weight: 600; }
.metric-field input {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: 9px 11px;
  color: var(--text);
  font-size: .85rem;
  font-weight: 600;
}
.metric-field input:focus { outline: none; border-color: var(--accent); }

/* Pubs Instagram */
.ig-pubs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.ig-pub-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}
.ig-pub-icon { font-size: 1.6rem; }
.ig-pub-label { font-size: .8rem; font-weight: 600; color: var(--text-soft); }
.ig-pub-input {
  width: 90px;
  text-align: center;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: 7px;
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
}
.ig-pub-input:focus { outline: none; border-color: var(--accent); }

/* KPI cards */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}
.kpi-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-top: 3px solid var(--kpi-color);
  border-radius: 12px;
  padding: 14px;
  position: relative;
}
.kpi-icon { font-size: 1.4rem; margin-bottom: 4px; }
.kpi-label { font-size: .72rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.kpi-value { font-size: 1.5rem; font-weight: 800; color: var(--text); }
.kpi-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-size: .68rem;
}
.kpi-trend-up { color: var(--green); font-weight: 600; }
.kpi-trend-down { color: var(--red); font-weight: 600; }
.kpi-trend-flat { color: var(--muted); }
.kpi-goal-wrap { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border-soft); }
.kpi-goal-label {
  display: flex;
  justify-content: space-between;
  font-size: .65rem;
  color: var(--muted);
  margin-bottom: 4px;
}
.kpi-goal-bar {
  height: 5px;
  background: var(--s3);
  border-radius: 3px;
  overflow: hidden;
}
.kpi-goal-fill { height: 100%; transition: width .4s ease; }

/* Metas */
.sem-goals-wrap { display: flex; flex-direction: column; gap: 14px; }
.sem-block {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
}
.sem-block-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.sem-block-title { font-size: .92rem; font-weight: 700; flex: 1; }
.sem-badge {
  font-size: .67rem;
  background: var(--accent);
  color: #fff;
  padding: 3px 9px;
  border-radius: 10px;
  font-weight: 700;
}
.sem-goals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}
.sem-goal-item { display: flex; flex-direction: column; gap: 5px; }
.sem-goal-item label { font-size: .72rem; color: var(--text-soft); font-weight: 600; }
.sem-goal-item input {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: 8px 11px;
  color: var(--text);
  font-size: .82rem;
}
.sem-goal-item input:focus { outline: none; border-color: var(--accent); }

/* Charts */
.charts-2col {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 14px;
}
.chart-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  position: relative;
}
.chart-card-title {
  font-size: .82rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text);
}
.chart-wrap { height: 220px; }

/* Tabela comparativa */
.compare-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-size: .8rem;
}
.compare-table th, .compare-table td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-soft);
}
.compare-table th {
  background: var(--s1);
  font-weight: 700;
  color: var(--muted);
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.compare-table tbody tr:hover { background: var(--card-hover); }
.compare-table .ct-cur { font-weight: 700; color: var(--accent); }
.ct-goal-ok { color: var(--green); font-weight: 700; }
.ct-goal-no { color: var(--orange); font-weight: 700; }

/* Breakdown YT */
.breakdown-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.breakdown-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}
.breakdown-card-title {
  font-size: .85rem;
  font-weight: 700;
  margin-bottom: 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--border-soft);
}
.breakdown-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.breakdown-field label { font-size: .68rem; color: var(--muted); font-weight: 600; }
.breakdown-field input {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 7px;
  padding: 6px 9px;
  color: var(--text);
  font-size: .78rem;
}
.breakdown-field input:focus { outline: none; border-color: var(--accent); }

/* Funil */
.funnel-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0;
}
.funnel-step {
  flex: 1;
  min-width: 130px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
}
.funnel-icon { font-size: 1.4rem; margin-bottom: 4px; }
.funnel-label { font-size: .72rem; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
.funnel-value { font-size: 1.3rem; font-weight: 800; color: var(--text); }
.funnel-pct { font-size: .66rem; color: var(--accent-3); margin-top: 4px; font-weight: 600; }

/* Tabela vídeos YT */
.pub-videos-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-size: .78rem;
}
.pub-videos-table th, .pub-videos-table td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border-soft);
}
.pub-videos-table th {
  background: var(--s1);
  font-weight: 700;
  color: var(--muted);
  font-size: .7rem;
  text-transform: uppercase;
}
.pvt-title { font-weight: 600; }
.pvt-bu {
  display: inline-block;
  background: rgba(244, 114, 182, .15);
  color: var(--pink);
  padding: 1px 7px;
  border-radius: 8px;
  font-size: .67rem;
  font-weight: 600;
}
.pvt-input {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 6px;
  padding: 4px 8px;
  color: var(--text);
  font-size: .76rem;
  width: 80px;
}
.pvt-input:focus { outline: none; border-color: var(--accent); }
.pvt-add-btn {
  margin-top: 10px;
  background: var(--s2);
  border: 1px dashed var(--border);
  color: var(--muted);
  padding: 8px;
  border-radius: 9px;
  font-size: .77rem;
  font-weight: 600;
  width: 100%;
}
.pvt-add-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Selected emoji preview */
.selected-emoji-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--s1);
  border-radius: 11px;
  margin-bottom: 12px;
  font-size: .85rem;
  color: var(--text-soft);
}
.big-emoji { font-size: 2.2rem; }

.emoji-search {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 9px;
  padding: 8px 12px;
  color: var(--text);
  font-size: .85rem;
  margin-bottom: 12px;
}
.emoji-search:focus { outline: none; border-color: var(--accent); }

.emoji-section-label {
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin: 12px 0 6px;
}
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
  gap: 5px;
}
.emoji-btn {
  background: var(--s2);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 7px;
  font-size: 1.2rem;
  cursor: pointer;
  transition: all .15s ease;
}
.emoji-btn:hover {
  background: var(--accent);
  transform: scale(1.15);
}
.emoji-btn.sel {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 0 2px var(--text);
  transform: scale(1.15);
}

/* Campanhas modal */
.camp-section-title {
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin: 14px 0 8px;
}
.camp-list { display: flex; flex-direction: column; gap: 5px; max-height: 220px; overflow-y: auto; }
.camp-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 11px;
  background: var(--s1);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
}
.camp-item-name { font-size: .82rem; }
.camp-del-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: .75rem;
  padding: 3px 7px;
  border-radius: 5px;
}
.camp-del-btn:hover { background: var(--red); color: #fff; }

.camp-add-row {
  display: flex;
  gap: 6px;
}
.camp-add-row input {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: 8px 11px;
  color: var(--text);
  font-size: .82rem;
}
.camp-add-row input:focus { outline: none; border-color: var(--accent); }
.camp-add-row button {
  background: var(--accent);
  border: none;
  color: #fff;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: .77rem;
  font-weight: 600;
}

/* ═══════════════════════════════════════════════════════════
   🍞 TOAST
═══════════════════════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--accent);
  color: #fff;
  padding: 11px 22px;
  border-radius: 12px;
  font-size: .85rem;
  font-weight: 600;
  z-index: 200;
  opacity: 0;
  transition: all .3s cubic-bezier(.4, 0, .2, 1);
  box-shadow: var(--shadow-lg);
  max-width: calc(100vw - 40px);
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══════════════════════════════════════════════════════════
   📱 RESPONSIVO
═══════════════════════════════════════════════════════════ */
@media (max-width: 980px) {
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    transform: translateX(-100%);
    z-index: 60;
  }
  .sidebar.open { transform: translateX(0); }
  .btn-mobile-toggle { display: inline-flex; }
}

@media (max-width: 720px) {
  .cal-day { min-height: 100px; }
  .topbar { padding: 10px 14px; }
  .main-content { padding: 14px; }
  .modal { padding: 18px; }
  .filter-bar { padding: 12px 14px; }
  .month-header { flex-direction: column; align-items: stretch; }
  .month-right-btns { width: 100%; }
  .btn-add-main, .btn-excel { flex: 1; }
  .dash-topbar { flex-direction: column; align-items: stretch; }
  .dash-controls { justify-content: space-between; }
}

<div class="toast" id="toast"></div>/* ═══════════════════════════════════════════════════════════
   🌓 SISTEMA DE TEMA (LIGHT/DARK)
═══════════════════════════════════════════════════════════ */
const THEME_KEY = 'cal_theme';

function initTheme() {
  // Padrão: escuro (conforme você pediu)
  const saved = localStorage.getItem(THEME_KEY) || 'dark';
  applyTheme(saved);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
  const thumb = document.getElementById('themeToggleThumb');
  if (thumb) thumb.textContent = theme === 'light' ? '☀️' : '🌙';

  // Atualiza cores dos charts se o dashboard estiver aberto
  if (typeof renderDashboard === 'function' && document.getElementById('dashContent')?.classList.contains('active')) {
    setTimeout(() => renderDashboard(), 50);
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  showToast(next === 'light' ? '☀️ Modo claro ativado' : '🌙 Modo escuro ativado');
}

/* ═══════════════════════════════════════════════════════════
   🎉 SISTEMA DE EVENTOS IMPORTANTES
═══════════════════════════════════════════════════════════ */
const WELCOME_SHOWN_KEY = 'cal_welcome_shown_date';
const WELCOME_DONTSHOW_KEY = 'cal_welcome_dontshow_date';
const EVENT_CATEGORY_NAME = '🎉 Evento';

/* Garante que a categoria "🎉 Evento" exista */
async function ensureEventCategory() {
  if (!Array.isArray(categories)) return null;

  let evCat = categories.find(c => c.name === EVENT_CATEGORY_NAME || c.emoji === '🎉');
  if (evCat) return evCat;

  // Cria a categoria automaticamente
  evCat = {
    id: 'cat_event_' + Date.now(),
    name: EVENT_CATEGORY_NAME,
    color: '#f472b6',
    emoji: '🎉',
    isSystem: true
  };
  categories.push(evCat);

  try {
    if (typeof saveCategoriesFs === 'function') {
      await saveCategoriesFs();
    }
  } catch (e) { console.warn('Erro ao salvar categoria de evento:', e); }

  if (typeof renderCategoryList === 'function') renderCategoryList();
  return evCat;
}

/* Detecta se um card é evento (pela categoria) */
function isEventCard(card) {
  if (!card || !card.catId) return false;
  const cat = categories.find(c => c.id === card.catId);
  return !!(cat && (cat.name === EVENT_CATEGORY_NAME || cat.emoji === '🎉'));
}

/* Calcula dias até a data (ignora horas) */
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr + 'T00:00:00');
  target.setHours(0, 0, 0, 0);
  const diff = Math.round((target - today) / (1000 * 60 * 60 * 24));
  return diff;
}

/* Retorna eventos futuros (próximos 90 dias) */
function getUpcomingEvents(maxDays = 90) {
  if (!Array.isArray(cards)) return [];
  const all = cards
    .filter(c => isEventCard(c))
    .map(c => ({ ...c, daysLeft: daysUntil(c.date) }))
    .filter(c => c.daysLeft !== null && c.daysLeft >= 0 && c.daysLeft <= maxDays)
    .sort((a, b) => a.daysLeft - b.daysLeft);
  return all;
}

/* Classifica urgência */
function eventUrgency(days) {
  if (days <= 3) return 'urgent';
  if (days <= 14) return 'soon';
  if (days <= 30) return 'normal';
  return 'far';
}

/* ───────── BADGE DO TOPBAR ───────── */
function refreshEventBadge() {
  const badge = document.getElementById('eventBadgeTopbar');
  const text = document.getElementById('eventBadgeText');
  const count = document.getElementById('eventBadgeCount');
  if (!badge) return;

  const events = getUpcomingEvents(60);
  if (events.length === 0) {
    badge.classList.add('empty');
    return;
  }
  badge.classList.remove('empty');

  const next = events[0];
  const dl = next.daysLeft;
  let label;
  if (dl === 0) label = `🎉 ${next.title || 'Evento'} é HOJE`;
  else if (dl === 1) label = `${next.title || 'Evento'} amanhã`;
  else label = `${next.title || 'Evento'} em ${dl} dias`;

  // Trunca texto longo
  if (label.length > 38) label = label.slice(0, 35) + '…';
  text.textContent = label;
  count.textContent = events.length;
}

/* ───────── PAINEL DE EVENTOS (sidebar/topbar) ───────── */
function openEventsPanel() {
  const events = getUpcomingEvents(365);
  const body = document.getElementById('eventsPanelBody');
  if (!body) return;

  if (events.length === 0) {
    body.innerHTML = `
      <div class="welcome-empty">
        <div class="welcome-empty-icon">📭</div>
        <p>Nenhum evento cadastrado.</p>
        <p style="font-size:.75rem;margin-top:6px">Crie um card na categoria <strong>"🎉 Evento"</strong> para vê-lo aqui.</p>
      </div>`;
  } else {
    body.innerHTML = `<div class="welcome-events-list">${events.map(renderEventItemHTML).join('')}</div>`;
  }
  openOverlay('eventsPanelOverlay');
}

function renderEventItemHTML(ev) {
  const urg = eventUrgency(ev.daysLeft);
  const daysClass = urg === 'urgent' ? 'urgent' : urg === 'soon' ? 'soon' : 'normal';
  const itemClass = urg === 'urgent' ? 'urgent' : urg === 'soon' ? 'soon' : urg === 'far' ? 'far' : '';
  const dateFmt = formatEventDate(ev.date);
  const platName = (platforms || []).find(p => p.id === ev.platformId)?.name || '';
  const bu = ev.bu || '';

  let daysLabel;
  if (ev.daysLeft === 0) daysLabel = 'HOJE';
  else if (ev.daysLeft === 1) daysLabel = 'AMANHÃ';
  else daysLabel = `EM ${ev.daysLeft} DIAS`;

  return `
    <div class="welcome-event-item ${itemClass}" onclick="closeOverlay('welcomeOverlay');closeOverlay('eventsPanelOverlay');openDetailById('${ev.id}')">
      <div class="welcome-event-countdown">
        <div class="welcome-event-days ${daysClass}">${ev.daysLeft === 0 ? '🎉' : ev.daysLeft}</div>
        <div class="welcome-event-days-lbl">${ev.daysLeft <= 1 ? daysLabel : 'dias'}</div>
      </div>
      <div class="welcome-event-info">
        <div class="welcome-event-title">${escapeHtml(ev.title || 'Evento sem título')}</div>
        <div class="welcome-event-meta">
          <span class="welcome-event-meta-badge">📅 ${dateFmt}</span>
          ${platName ? `<span class="welcome-event-meta-badge">${escapeHtml(platName)}</span>` : ''}
          ${bu ? `<span class="welcome-event-meta-badge">🏢 ${escapeHtml(bu)}</span>` : ''}
        </div>
      </div>
    </div>`;
}

function formatEventDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ───────── POP-UP DE BOAS-VINDAS ───────── */
function maybeShowWelcomeModal() {
  const today = new Date().toISOString().slice(0, 10);

  // Se marcou "não mostrar de novo HOJE", respeita
  const dontShow = localStorage.getItem(WELCOME_DONTSHOW_KEY);
  if (dontShow === today) return;

  // Conforme você pediu: mostra 1x por dia (na primeira entrada do dia)
  const lastShown = localStorage.getItem(WELCOME_SHOWN_KEY);
  if (lastShown === today) return;

  const events = getUpcomingEvents(60);
  if (events.length === 0) {
    // Mesmo sem eventos, marca como mostrado para não verificar de novo hoje
    localStorage.setItem(WELCOME_SHOWN_KEY, today);
    return;
  }

  renderWelcomeModal(events);
  localStorage.setItem(WELCOME_SHOWN_KEY, today);
}

function renderWelcomeModal(events) {
  const body = document.getElementById('welcomeBody');
  const subtitle = document.getElementById('welcomeSubtitle');
  if (!body) return;

  const urgent = events.filter(e => e.daysLeft <= 7);
  if (urgent.length > 0) {
    subtitle.textContent = `Você tem ${urgent.length} evento${urgent.length > 1 ? 's' : ''} próximo${urgent.length > 1 ? 's' : ''}!`;
  } else {
    subtitle.textContent = `${events.length} evento${events.length > 1 ? 's' : ''} cadastrado${events.length > 1 ? 's' : ''}`;
  }

  body.innerHTML = `<div class="welcome-events-list">${events.slice(0, 6).map(renderEventItemHTML).join('')}</div>`;

  // Reset checkbox
  const cb = document.getElementById('welcomeDontShow');
  if (cb) cb.checked = false;

  openOverlay('welcomeOverlay');
}

function closeWelcomeModal() {
  const cb = document.getElementById('welcomeDontShow');
  if (cb && cb.checked) {
    const today = new Date().toISOString().slice(0, 10);
    localStorage.setItem(WELCOME_DONTSHOW_KEY, today);
  }
  closeOverlay('welcomeOverlay');
}

/* Helper para abrir detalhe a partir do evento */
function openDetailById(id) {
  const card = cards.find(c => c.id === id);
  if (card && typeof openDetail === 'function') {
    openDetail(card);
  }
}

/* Lista de emojis para o painel inline de plataformas */
const QUICK_EMOJIS = [
  '📱', '📸', '▶️', '🎵', '💼', '📧', '📝', '🌐',
  '💬', '🎬', '🎨', '📺', '🎙️', '📰', '🔊', '🎯',
  '🚀', '⭐', '🔥', '💡', '🎉', '📊', '📈', '🏆',
  '💎', '🎁', '🏷️', '🔔', '📢', '🎪', '🎭', '🎤'
];

/* Estado do emoji em edição */
let _pendingImpEmoji = '🔹';

function buildImpEmojiGrid() {
  const grid = document.getElementById('impEmojiGrid');
  if (!grid) return;
  grid.innerHTML = QUICK_EMOJIS.map(em => `
    <button type="button" class="emoji-inline-btn" onclick="pickImpEmoji('${em}')">${em}</button>
  `).join('');
}

  const panel = document.getElementById('impEmojiPanel');
  if (!panel) return;
  if (!panel.dataset.built) {
    buildImpEmojiGrid();
    panel.dataset.built = '1';
  }
  panel.classList.toggle('open');
}

function pickImpEmoji(em) {
  _pendingImpEmoji = em;
  const btn = document.getElementById('impEmojiBtn');
  if (btn) btn.textContent = em;
  const panel = document.getElementById('impEmojiPanel');
  if (panel) panel.classList.remove('open');
}

/* SOBRESCREVE a função addFilterPlatform para incluir o emoji escolhido */
function addFilterPlatform() {
  const input = document.getElementById('impPlatformInput');
  if (!input) return;
  const name = input.value.trim();
  if (!name) {
    showToast('⚠️ Informe o nome da plataforma');
    return;
  }

  // Verifica duplicata
  if ((platforms || []).some(p => p.name.toLowerCase() === name.toLowerCase())) {
    showToast('⚠️ Plataforma já existe');
    return;
  }

  const newPlat = {
    id: 'plat_' + Date.now(),
    name: name,
    emoji: _pendingImpEmoji || '🔹'
  };
  platforms.push(newPlat);

  // Reset
  input.value = '';
  _pendingImpEmoji = '🔹';
  const btn = document.getElementById('impEmojiBtn');
  if (btn) btn.textContent = '🔹';

  // Persiste
  if (typeof savePlatformsFs === 'function') savePlatformsFs();

  // Atualiza UI
  if (typeof renderPlatformFilters === 'function') renderPlatformFilters();
  if (typeof renderPlatformPicker === 'function') renderPlatformPicker();
  if (typeof renderImpPlatformList === 'function') renderImpPlatformList();

  showToast(`✅ Plataforma "${newPlat.emoji} ${newPlat.name}" criada`);
}

/* ═══════════════════════════════════════════════════════════
   🚀 INICIALIZAÇÃO — Tema + Eventos
═══════════════════════════════════════════════════════════ */
function initThemeAndEvents() {

  initTheme();

  // 2. Garante categoria de evento
  setTimeout(async () => {
    await ensureEventCategory();
