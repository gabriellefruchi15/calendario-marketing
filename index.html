<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Agenda Anual</title>
<style>
:root{
  --bg:#f5f7fa;
  --card-bg:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --primary:#4f46e5;
  --primary-hover:#4338ca;
  --border:#e5e7eb;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --radius:10px;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
body{margin:0;background:var(--bg);color:var(--text);}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:#fff;box-shadow:var(--shadow);
  position:sticky;top:0;z-index:50;
}
.topbar h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px;}
.topbar .year-nav{display:flex;align-items:center;gap:8px;}
.topbar button{
  background:var(--primary);color:#fff;border:none;border-radius:6px;
  padding:6px 12px;cursor:pointer;font-size:14px;
}
.topbar button:hover{background:var(--primary-hover);}
.tabs{display:flex;gap:8px;}
.tab{
  background:#e5e7eb;color:var(--text);border:none;border-radius:6px;
  padding:6px 14px;cursor:pointer;font-size:14px;
}
.tab.active{background:var(--primary);color:#fff;}
.container{max-width:1400px;margin:20px auto;padding:0 20px;}
.months-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
}
.month-card{
  background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:12px;
}
.month-card h3{margin:0 0 8px;font-size:15px;text-align:center;}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;}
.mini-cal .dow{text-align:center;color:var(--muted);font-weight:600;padding:2px;}
.mini-cal .day{
  text-align:center;padding:4px 2px;border-radius:4px;cursor:pointer;
  transition:background .15s;
}
.mini-cal .day:hover{background:#eef2ff;}
.mini-cal .day.today{background:#fef3c7;font-weight:700;}
.mini-cal .day.has-events{background:var(--primary);color:#fff;font-weight:600;}
.day-view{
  background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;margin-top:20px;
}
.day-card-row{
  background:#f9fafb;border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s;
}
.day-card-row:hover{background:#eef2ff;border-color:var(--primary);}
.day-card-row.dragging{opacity:.5;}
.day-card-row .title{font-weight:600;margin-bottom:4px;}
.day-card-row .badges{display:flex;flex-wrap:wrap;gap:4px;}
.badge{
  display:inline-block;background:#e0e7ff;color:#3730a3;
  border-radius:12px;padding:2px 8px;font-size:11px;
}
.person-chip{
  display:inline-block;color:#fff;border-radius:12px;
  padding:2px 8px;font-size:11px;font-weight:600;
}
.filter-bar{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:8px 0;margin-bottom:12px;border-bottom:1px solid var(--border);
}
.f-chip{
  background:#e5e7eb;color:var(--text);border-radius:12px;
  padding:3px 10px;font-size:12px;cursor:pointer;
}
.f-chip.active{color:#fff;font-weight:600;}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal{
  background:#fff;border-radius:var(--radius);padding:24px;
  max-width:600px;width:100%;max-height:90vh;overflow-y:auto;
}
.modal h3{margin:0 0 16px;}
.modal label{
  display:block;font-size:13px;font-weight:600;
  margin:12px 0 4px;color:var(--muted);
}
.modal input[type=text],
.modal input[type=date],
.modal select,
.modal textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);
  border-radius:6px;font-size:14px;
}
.modal textarea{min-height:60px;resize:vertical;}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.recur-hint{font-size:12px;color:var(--muted);margin-top:4px;}
.picker-box{
  border:1px solid var(--border);border-radius:6px;padding:8px;background:#f9fafb;
}
.picker-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:24px;}
.picker-tag{
  color:#fff;border-radius:12px;padding:3px 10px;font-size:12px;
  display:inline-flex;align-items:center;gap:4px;
}
.picker-tag .x{cursor:pointer;font-weight:bold;}
.picker-input-row{display:flex;gap:6px;}
.picker-input-row input{flex:1;}
.picker-input-row button{
  background:var(--primary);color:#fff;border:none;border-radius:6px;
  padding:0 12px;cursor:pointer;
}
.people-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.modal .actions{
  display:flex;justify-content:flex-end;gap:8px;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--border);
}
.modal .actions button{
  padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;
}
.modal .actions .primary{background:var(--primary);color:#fff;}
.modal .actions .secondary{background:#e5e7eb;color:var(--text);}
.modal .actions .danger{background:#ef4444;color:#fff;margin-right:auto;}
.dashboard{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;margin-top:20px;
}
.dash-card{
  background:var(--card-bg);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;
}
.dash-card h4{margin:0 0 12px;font-size:14px;color:var(--muted);}
.stat-big{font-size:36px;font-weight:700;color:var(--primary);}
</style>
</head>
<body>

<div class="topbar">
  <h1>📅 <span>Agenda</span></h1>
  <div class="tabs">
    <button id="tabAgenda" class="tab active" onclick="switchView('agenda')">Agenda</button>
    <button id="tabDash" class="tab" onclick="switchView('dashboard')">Dashboard</button>
  </div>
  <div class="year-nav">
    <button onclick="changeYear(-1)">◀</button>
    <strong id="topbarYear">2026</strong>
    <button onclick="changeYear(1)">▶</button>
  </div>
</div>

<div class="container">
  <div id="viewAgenda">
    <h2 style="margin:0 0 16px;">Ano <span id="yearLabel">2026</span></h2>
    <div id="monthsGrid" class="months-grid"></div>
    <div id="dayView" class="day-view" style="display:none;"></div>
  </div>
  <div id="viewDashboard" style="display:none;"></div>
</div>

<div id="modalRoot"></div>

<script>// ===================== ESTADO GLOBAL =====================
let currentYear = new Date().getFullYear();
let view = "agenda";
let selectedDate = null;
let cards = [];
let recurInstances = [];
let peopleList = [];
let activeFilters = { people: [], tags: [] };

// ===================== STORAGE =====================
const LS_CARDS = "agenda_cards_v1";
const LS_PEOPLE = "agenda_people_v1";

try {
  cards = JSON.parse(localStorage.getItem(LS_CARDS) || "[]");
  peopleList = JSON.parse(localStorage.getItem(LS_PEOPLE) || "[]");
} catch(e) {
  console.error("Erro ao carregar storage", e);
}

function saveCards(){
  localStorage.setItem(LS_CARDS, JSON.stringify(cards));
}
function savePeopleList(){
  localStorage.setItem(LS_PEOPLE, JSON.stringify(peopleList));
}

// ===================== UTILS =====================
function toArr(v){ return Array.isArray(v) ? v : [v]; }
function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseDate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

// Gera cor distinta para pessoa
function generatePersonColor(name, existingColors){
  const palette = ["#ef4444","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#f97316"];
  for(const c of palette){
    if(!existingColors.includes(c)) return c;
  }
  // fallback HSL aleatório
  const h = Math.floor(Math.random()*360);
  return `hsl(${h},65%,50%)`;
}

// ===================== GERENCIAR PESSOAS =====================
function addPerson(pid){
  const inp = document.getElementById(pid+"-inp");
  const name = inp.value.trim();
  if(!name) return;
  let person = peopleList.find(p => p.name.toLowerCase() === name.toLowerCase());
  if(!person){
    const color = generatePersonColor(name, peopleList.map(p=>p.color));
    person = { name, color };
    peopleList.push(person);
    savePeopleList();
  }
  if(!pickerSelected[pid]) pickerSelected[pid] = [];
  if(!pickerSelected[pid].includes(person.name)){
    pickerSelected[pid].push(person.name);
  }
  inp.value = "";
  renderPeopleList(pid);
  renderPickerTags(pid);
  onCardFormChange();
}

function togglePersonFilter(name){
  const idx = activeFilters.people.indexOf(name);
  if(idx >= 0) activeFilters.people.splice(idx,1);
  else activeFilters.people.push(name);
  renderDayView(selectedDate);
}

function removePersonFromPicker(pid, name){
  if(pickerSelected[pid]){
    pickerSelected[pid] = pickerSelected[pid].filter(n => n !== name);
  }
  renderPickerTags(pid);
  onCardFormChange();
}

function renderPeopleList(pid){
  const box = document.getElementById(pid+"-list");
  if(!box) return;
  box.innerHTML = peopleList.map(p => `
    <span class="person-chip" style="background:${p.color};cursor:pointer;"
      onclick="addPersonByName('${pid}','${p.name.replace(/'/g,"\\'")}')">${p.name}</span>
  `).join("");
}

function addPersonByName(pid, name){
  if(!pickerSelected[pid]) pickerSelected[pid] = [];
  if(!pickerSelected[pid].includes(name)){
    pickerSelected[pid].push(name);
    renderPickerTags(pid);
    onCardFormChange();
  }
}

let pickerSelected = {};
function renderPickerTags(pid){
  const box = document.getElementById(pid+"-tags");
  if(!box) return;
  const sel = pickerSelected[pid] || [];
  box.innerHTML = sel.map(name => {
    const p = peopleList.find(x => x.name === name);
    const color = p ? p.color : "#6b7280";
    return `<span class="picker-tag" style="background:${color}">
      ${name}<span class="x" onclick="removePersonFromPicker('${pid}','${name.replace(/'/g,"\\'")}')">×</span>
    </span>`;
  }).join("");
}

// Tags genéricas (não pessoas)
let pickerTags = {};
function addTag(pid){
  const inp = document.getElementById(pid+"-inp");
  const val = inp.value.trim();
  if(!val) return;
  if(!pickerTags[pid]) pickerTags[pid] = [];
  if(!pickerTags[pid].includes(val)){
    pickerTags[pid].push(val);
  }
  inp.value = "";
  renderTagPickerTags(pid);
  onCardFormChange();
}
function removeTagFromPicker(pid, tag){
  if(pickerTags[pid]){
    pickerTags[pid] = pickerTags[pid].filter(t => t !== tag);
  }
  renderTagPickerTags(pid);
  onCardFormChange();
}
function renderTagPickerTags(pid){
  const box = document.getElementById(pid+"-tags");
  if(!box) return;
  const sel = pickerTags[pid] || [];
  box.innerHTML = sel.map(tag => `
    <span class="picker-tag" style="background:#6366f1">
      ${tag}<span class="x" onclick="removeTagFromPicker('${pid}','${tag.replace(/'/g,"\\'")}')">×</span>
    </span>
  `).join("");
}

// ===================== RECORRÊNCIA =====================
function rebuildRecurInstances(){
  recurInstances = [];
  const yearStart = new Date(currentYear, 0, 1);
  const yearEnd = new Date(currentYear, 11, 31);

  cards.forEach(c => {
    if(!c.recurrence || c.recurrence === "none") return;
    let cur = parseDate(c.date);
    // avança até entrar no ano
    while(cur < yearStart){
      if(c.recurrence === "daily") cur.setDate(cur.getDate()+1);
      else if(c.recurrence === "weekly") cur.setDate(cur.getDate()+7);
      else if(c.recurrence === "biweekly") cur.setDate(cur.getDate()+14);
      else if(c.recurrence === "monthly") cur.setMonth(cur.getMonth()+1);
      else break;
    }
    // gera instâncias dentro do ano (evita duplicar o original)
    while(cur <= yearEnd){
      if(fmtDate(cur) !== c.date){
        recurInstances.push({
          ...c,
          id: c.id + "_rec_" + fmtDate(cur),
          date: fmtDate(cur),
          recurParentId: c.id,
          isRecurInstance: true
        });
      }
      if(c.recurrence === "daily") cur.setDate(cur.getDate()+1);
      else if(c.recurrence === "weekly") cur.setDate(cur.getDate()+7);
      else if(c.recurrence === "biweekly") cur.setDate(cur.getDate()+14);
      else if(c.recurrence === "monthly") cur.setMonth(cur.getMonth()+1);
      else break;
    }
  });
}

// retorna cards diretos e recorrentes para uma data
function getCardsForDate(dateStr){
  const direct = cards.filter(c => c.date === dateStr);
  const directParentIds = new Set(direct.map(c => c.id));
  const recur = recurInstances.filter(r => r.date === dateStr && !directParentIds.has(r.recurParentId));
  const all = [...direct, ...recur];
  return applyFilters(all);
}

function applyFilters(list){
  return list.filter(c => {
    if(activeFilters.people.length){
      const resp = toArr(c.responsavel || []);
      if(!activeFilters.people.some(p => resp.includes(p))) return false;
    }
    if(activeFilters.tags.length){
      const tags = toArr(c.tags || []);
      if(!activeFilters.tags.some(t => tags.includes(t))) return false;
    }
    return true;
  });
}

// ===================== NAVEGAÇÃO =====================
function changeYear(delta){
  currentYear += delta;
  document.getElementById("yearLabel").textContent = currentYear;
  document.getElementById("topbarYear").textContent = currentYear;
  rebuildRecurInstances();
  renderAll();
}

// ===================== SALVAR CARD =====================
function saveCard(cardData){
  // garante que pessoas existam em peopleList
  toArr(cardData.responsavel).forEach(name => {
    if(name && !peopleList.find(p => p.name === name)){
      const color = generatePersonColor(name, peopleList.map(p=>p.color));
      peopleList.push({ name, color });
    }
  });
  savePeopleList();
  buildRespFilters();

  const existingIdx = cards.findIndex(c => c.id === cardData.id);
  if(existingIdx >= 0){
    cards[existingIdx] = cardData;
  } else {
    cards.push(cardData);
  }
  saveCards();
  rebuildRecurInstances();
  renderAll();
}

function deleteCard(id){
  cards = cards.filter(c => c.id !== id);
  saveCards();
  rebuildRecurInstances();
  renderAll();
}

function updateRecurHint(selectEl){
  const val = selectEl.value;
  const hint = document.getElementById("recurHint");
  const labelMap = {
    daily:"diárias", weekly:"semanais",
    biweekly:"quinzenais", monthly:"mensais"
  };
  hint.textContent = val && val !== "none"
    ? `♻️ Cria cópias ${labelMap[val] || ""} automaticamente até o fim do ano`
    : "";
}

function updateCommentsBadge(badge, count){
  if(!badge) return;
  badge.textContent = count ? `💬 ${count}` : "";
  badge.style.display = count ? "inline-block" : "none";
}

function onCardFormChange(){
  // stub p/ validação ao vivo (opcional)
}

// ===================== RENDER PRINCIPAL =====================
function renderAll(){
  renderMonthsGrid();
  if(selectedDate) renderDayView(selectedDate);
  if(view === "dashboard") renderDashboard();
}

function switchView(v){
  view = v;
  document.getElementById("tabAgenda").classList.toggle("active", v === "agenda");
  document.getElementById("tabDash").classList.toggle("active", v === "dashboard");
  document.getElementById("viewAgenda").style.display = v === "agenda" ? "" : "none";
  document.getElementById("viewDashboard").style.display = v === "dashboard" ? "" : "none";
  if(v === "dashboard") renderDashboard();
}

// ===================== GRID DE MESES =====================
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
  "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW = ["D","S","T","Q","Q","S","S"];

function renderMonthsGrid(){
  const grid = document.getElementById("monthsGrid");
  if(!grid) return;
  let html = "";
  for(let m = 0; m < 12; m++){
    html += renderMiniMonth(currentYear, m);
  }
  grid.innerHTML = html;
}

function renderMiniMonth(year, month){
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const startDow = first.getDay();
  const totalDays = last.getDate();
  const today = new Date();
  const isToday = (d) => today.getFullYear() === year
    && today.getMonth() === month
    && today.getDate() === d;

  let cells = "";
  for(const dow of DOW){
    cells += `<div class="dow">${dow}</div>`;
  }
  for(let i = 0; i < startDow; i++){
    cells += `<div></div>`;
  }
  for(let d = 1; d <= totalDays; d++){
    const dateStr = fmtDate(new Date(year, month, d));
    const dayCards = getCardsForDate(dateStr);
    const cls = ["day"];
    if(isToday(d)) cls.push("today");
    if(dayCards.length) cls.push("has-events");
    cells += `<div class="${cls.join(' ')}" onclick="selectDate('${dateStr}')">${d}</div>`;
  }
  return `<div class="month-card">
    <h3>${MESES[month]}</h3>
    <div class="mini-cal">${cells}</div>
  </div>`;
}

function selectDate(dateStr){
  selectedDate = dateStr;
  renderDayView(dateStr);
  document.getElementById("dayView").scrollIntoView({behavior:"smooth", block:"start"});
}// ===================== DAY VIEW =====================
function renderDayView(dateStr){
  if(!dateStr) return;
  const box = document.getElementById("dayView");
  box.style.display = "block";
  const d = parseDate(dateStr);
  const dayCards = getCardsForDate(dateStr);

  // barra de filtros (pessoas + tags)
  const allPeople = peopleList;
  const allTags = [...new Set(cards.flatMap(c => toArr(c.tags||[])))].filter(Boolean);

  const peopleFilterHtml = allPeople.map(p => {
    const active = activeFilters.people.includes(p.name);
    return `<span class="f-chip ${active?'active':''}"
      style="${active?`background:${p.color};`:''}"
      onclick="togglePersonFilter('${p.name.replace(/'/g,"\\'")}')">${p.name}</span>`;
  }).join("");

  const tagFilterHtml = allTags.map(t => {
    const active = activeFilters.tags.includes(t);
    return `<span class="f-chip ${active?'active':''}"
      style="${active?'background:#6366f1;':''}"
      onclick="toggleTagFilter('${t.replace(/'/g,"\\'")}')">${t}</span>`;
  }).join("");

  const cardsHtml = dayCards.length
    ? dayCards.map(c => renderDayCardRow(c)).join("")
    : `<p style="color:var(--muted);text-align:center;padding:20px;">
        Nenhum card neste dia.
      </p>`;

  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="margin:0;">📌 ${d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</h3>
      <button onclick="openCardModal(null,'${dateStr}')"
        style="background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;">
        ➕ Novo Card
      </button>
    </div>
    ${(allPeople.length || allTags.length) ? `
      <div class="filter-bar">
        ${allPeople.length?`<strong style="font-size:12px;color:var(--muted);">Pessoas:</strong> ${peopleFilterHtml}`:''}
        ${allTags.length?`<strong style="font-size:12px;color:var(--muted);margin-left:12px;">Tags:</strong> ${tagFilterHtml}`:''}
        ${(activeFilters.people.length||activeFilters.tags.length)?`
          <button onclick="clearFilters()" style="margin-left:auto;background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;">Limpar filtros</button>
        `:''}
      </div>
    `:''}
    <div id="dayCardsList">${cardsHtml}</div>
  `;
}

function toggleTagFilter(tag){
  const idx = activeFilters.tags.indexOf(tag);
  if(idx >= 0) activeFilters.tags.splice(idx,1);
  else activeFilters.tags.push(tag);
  renderDayView(selectedDate);
}
function clearFilters(){
  activeFilters = { people:[], tags:[] };
  renderDayView(selectedDate);
}

function buildRespFilters(){
  // recalcula automaticamente ao renderizar; stub mantido por compatibilidade
}

function renderDayCardRow(c){
  const resp = toArr(c.responsavel||[]).filter(Boolean);
  const tags = toArr(c.tags||[]).filter(Boolean);
  const respHtml = resp.map(name => {
    const p = peopleList.find(x => x.name === name);
    const color = p ? p.color : "#6b7280";
    return `<span class="person-chip" style="background:${color}">${name}</span>`;
  }).join("");
  const tagsHtml = tags.map(t => `<span class="badge">${t}</span>`).join("");
  const commentsCount = (c.comments||[]).length;
  const recurIcon = c.isRecurInstance ? "♻️ " : "";
  return `<div class="day-card-row" onclick="openCardModal('${c.id}')">
    <div class="title">${recurIcon}${c.titulo||"(sem título)"}</div>
    <div class="badges">
      ${respHtml}${tagsHtml}
      ${commentsCount?`<span class="badge">💬 ${commentsCount}</span>`:''}
    </div>
  </div>`;
}

// ===================== MODAL DE CARD =====================
function openCardModal(id, defaultDate){
  let card;
  const isEdit = !!id;
  if(isEdit){
    // se for instância recorrente, edita o pai
    const realId = id.includes("_rec_") ? id.split("_rec_")[0] : id;
    card = cards.find(c => c.id === realId);
    if(!card){ alert("Card não encontrado"); return; }
  } else {
    card = {
      id: uid(),
      titulo: "",
      descricao: "",
      date: defaultDate || fmtDate(new Date()),
      recurrence: "none",
      responsavel: [],
      tags: [],
      comments: []
    };
  }

  const pid = "picker_" + card.id;
  const tpid = "tagpicker_" + card.id;
  pickerSelected[pid] = [...toArr(card.responsavel||[])].filter(Boolean);
  pickerTags[tpid] = [...toArr(card.tags||[])].filter(Boolean);

  const modalRoot = document.getElementById("modalRoot");
  modalRoot.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${isEdit ? "✏️ Editar Card" : "➕ Novo Card"}</h3>

        <label>Título</label>
        <input type="text" id="f_titulo" value="${(card.titulo||'').replace(/"/g,'&quot;')}" oninput="onCardFormChange()"/>

        <label>Descrição</label>
        <textarea id="f_descricao" oninput="onCardFormChange()">${card.descricao||''}</textarea>

        <div class="row">
          <div>
            <label>Data</label>
            <input type="date" id="f_data" value="${card.date}" oninput="onCardFormChange()"/>
          </div>
          <div>
            <label>Recorrência</label>
            <select id="f_recur" onchange="updateRecurHint(this)">
              <option value="none" ${card.recurrence==='none'?'selected':''}>Nenhuma</option>
              <option value="daily" ${card.recurrence==='daily'?'selected':''}>Diária</option>
              <option value="weekly" ${card.recurrence==='weekly'?'selected':''}>Semanal</option>
              <option value="biweekly" ${card.recurrence==='biweekly'?'selected':''}>Quinzenal</option>
              <option value="monthly" ${card.recurrence==='monthly'?'selected':''}>Mensal</option>
            </select>
            <div class="recur-hint" id="recurHint"></div>
          </div>
        </div>

        <label>Responsáveis</label>
        <div class="picker-box">
          <div class="picker-tags" id="${pid}-tags"></div>
          <div class="picker-input-row">
            <input type="text" id="${pid}-inp" placeholder="Digite um nome e Enter"
              onkeydown="if(event.key==='Enter'){event.preventDefault();addPerson('${pid}')}"/>
            <button type="button" onclick="addPerson('${pid}')">+</button>
          </div>
          <div class="people-list" id="${pid}-list"></div>
        </div>

        <label>Tags</label>
        <div class="picker-box">
          <div class="picker-tags" id="${tpid}-tags"></div>
          <div class="picker-input-row">
            <input type="text" id="${tpid}-inp" placeholder="Digite uma tag e Enter"
              onkeydown="if(event.key==='Enter'){event.preventDefault();addTag('${tpid}')}"/>
            <button type="button" onclick="addTag('${tpid}')">+</button>
          </div>
        </div>

        <label>Comentários</label>
        <div id="commentsList">
          ${(card.comments||[]).map((cm,i) => `
            <div style="display:flex;gap:6px;margin-bottom:4px;align-items:center;">
              <input type="text" value="${cm.replace(/"/g,'&quot;')}" data-comment-idx="${i}" style="flex:1;"/>
              <button type="button" onclick="removeComment(${i})" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;">×</button>
            </div>
          `).join("")}
        </div>
        <div class="picker-input-row" style="margin-top:6px;">
          <input type="text" id="newCommentInp" placeholder="Novo comentário..."
            onkeydown="if(event.key==='Enter'){event.preventDefault();addComment()}"/>
          <button type="button" onclick="addComment()">+</button>
        </div>

        <div class="actions">
          ${isEdit?`<button class="danger" onclick="if(confirm('Excluir este card?')){deleteCard('${card.id}');closeModal();}">🗑 Excluir</button>`:''}
          <button class="secondary" onclick="closeModal()">Cancelar</button>
          <button class="primary" onclick="submitCard('${card.id}',${isEdit})">${isEdit?'Salvar':'Criar'}</button>
        </div>
      </div>
    </div>
  `;

  renderPickerTags(pid);
  renderPeopleList(pid);
  renderTagPickerTags(tpid);
  updateRecurHint(document.getElementById("f_recur"));

  // guarda referência para edição de comentários
  window._currentCardEditing = card;
  window._currentPid = pid;
  window._currentTpid = tpid;
}

function addComment(){
  const inp = document.getElementById("newCommentInp");
  const val = inp.value.trim();
  if(!val) return;
  const card = window._currentCardEditing;
  if(!card.comments) card.comments = [];
  card.comments.push(val);
  inp.value = "";
  refreshCommentsList();
}
function removeComment(idx){
  const card = window._currentCardEditing;
  card.comments.splice(idx,1);
  refreshCommentsList();
}
function refreshCommentsList(){
  const card = window._currentCardEditing;
  const box = document.getElementById("commentsList");
  box.innerHTML = (card.comments||[]).map((cm,i) => `
    <div style="display:flex;gap:6px;margin-bottom:4px;align-items:center;">
      <input type="text" value="${cm.replace(/"/g,'&quot;')}" data-comment-idx="${i}" style="flex:1;"/>
      <button type="button" onclick="removeComment(${i})" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;">×</button>
    </div>
  `).join("");
}

function submitCard(id, isEdit){
  const card = window._currentCardEditing;
  card.titulo = document.getElementById("f_titulo").value.trim();
  card.descricao = document.getElementById("f_descricao").value.trim();
  card.date = document.getElementById("f_data").value;
  card.recurrence = document.getElementById("f_recur").value;
  card.responsavel = [...(pickerSelected[window._currentPid]||[])];
  card.tags = [...(pickerTags[window._currentTpid]||[])];

  // atualiza comentários a partir dos inputs
  const commentInputs = document.querySelectorAll("#commentsList input[data-comment-idx]");
  card.comments = Array.from(commentInputs).map(i => i.value.trim()).filter(Boolean);

  if(!card.titulo){ alert("Informe um título"); return; }
  if(!card.date){ alert("Informe uma data"); return; }

  saveCard(card);
  closeModal();
}

function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  window._currentCardEditing = null;
}

// ===================== DASHBOARD =====================
function renderDashboard(){
  const box = document.getElementById("viewDashboard");
  const total = cards.length;
  const totalRecur = recurInstances.length;
  const byPerson = {};
  const byTag = {};
  const byMonth = Array(12).fill(0);

  [...cards, ...recurInstances].forEach(c => {
    toArr(c.responsavel||[]).forEach(p => {
      if(p) byPerson[p] = (byPerson[p]||0) + 1;
    });
    toArr(c.tags||[]).forEach(t => {
      if(t) byTag[t] = (byTag[t]||0) + 1;
    });
    if(c.date){
      const m = parseDate(c.date).getMonth();
      byMonth[m]++;
    }
  });

  const personRows = Object.entries(byPerson)
    .sort((a,b) => b[1]-a[1])
    .map(([name,count]) => {
      const p = peopleList.find(x => x.name === name);
      const color = p ? p.color : "#6b7280";
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
        <span class="person-chip" style="background:${color}">${name}</span>
        <strong>${count}</strong>
      </div>`;
    }).join("") || `<p style="color:var(--muted);">Sem dados</p>`;

  const tagRows = Object.entries(byTag)
    .sort((a,b) => b[1]-a[1])
    .map(([t,count]) => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
      <span class="badge">${t}</span><strong>${count}</strong>
    </div>`).join("") || `<p style="color:var(--muted);">Sem dados</p>`;

  const monthRows = byMonth.map((count,i) => `
    <div style="display:flex;justify-content:space-between;padding:4px 0;">
      <span>${MESES[i]}</span><strong>${count}</strong>
    </div>
  `).join("");

  box.innerHTML = `
    <h2 style="margin:0 0 16px;">📊 Dashboard ${currentYear}</h2>
    <div class="dashboard">
      <div class="dash-card">
        <h4>Total de cards</h4>
        <div class="stat-big">${total}</div>
        <p style="color:var(--muted);font-size:12px;margin:4px 0 0;">+ ${totalRecur} recorrências geradas</p>
      </div>
      <div class="dash-card">
        <h4>Por pessoa</h4>
        ${personRows}
      </div>
      <div class="dash-card">
        <h4>Por tag</h4>
        ${tagRows}
      </div>
      <div class="dash-card">
        <h4>Por mês</h4>
        ${monthRows}
      </div>
    </div>
  `;
}

// ===================== INICIALIZAÇÃO =====================
document.getElementById("yearLabel").textContent = currentYear;
document.getElementById("topbarYear").textContent = currentYear;
rebuildRecurInstances();
renderAll();
</script>
</body>
</html>
